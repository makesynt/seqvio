<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seqvio">
  <defs>
    <linearGradient id="seqvio-front-wm" x1="80" y1="72" x2="184" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EE7FF"/>
      <stop offset="0.55" stop-color="#38B6FF"/>
      <stop offset="1" stop-color="#4C7DFF"/>
    </linearGradient>
    <linearGradient id="seqvio-wm-maskgrad" x1="0" y1="118" x2="0" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="seqvio-wm-fade">
      <rect width="256" height="256" fill="url(#seqvio-wm-maskgrad)"/>
    </mask>
    <style>
      /* wordmark text adapts to light/dark host (works even when embedded as &lt;img&gt;) */
      .seqvio-wm-text { fill: #111827; }
      @media (prefers-color-scheme: dark) {
        .seqvio-wm-text { fill: #F1F5F9; }
      }
    </style>
  </defs>

  <!-- icon tile with lower-half trail (same geometry as seqvio-icon.svg, scaled to 64) -->
  <rect x="8" y="16" width="64" height="64" rx="15" fill="#1B2440"/>
  <g transform="translate(8,16) scale(0.25)">
    <g mask="url(#seqvio-wm-fade)">
      <g transform="translate(8.42,-4) matrix(1,0,-0.0990,1,0,0)">
        <path d="M92 74 C120 66 176 96 188 122 C196 140 176 158 150 168 L104 186 C90 191 78 181 80 167 C88 150 118 150 118 132 C118 116 92 116 92 100 Z" fill="#4FC3FF" opacity="0.9"/>
      </g>
    </g>
    <path d="M92 74 C120 66 176 96 188 122 C196 140 176 158 150 168 L104 186 C90 191 78 181 80 167 C88 150 118 150 118 132 C118 116 92 116 92 100 Z" fill="url(#seqvio-front-wm)"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="60" class="seqvio-wm-text"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.4">Seqvio</text>
</svg>
